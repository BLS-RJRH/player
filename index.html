<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- รองรับ Web App แบบเต็มจอเมื่อผู้ใช้ Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ER&EMS RJRH BINGO - Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #000c19, #001f3f, #003366, #001f3f);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden; /* ล็อคไม่ให้เลื่อนจอ */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .login-logo {
            width: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .login-title {
            color: #FFD700;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 18px;
            font-family: 'Sarabun', sans-serif;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            color: #001f3f;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            font-family: 'Sarabun', sans-serif;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        #game-screen {
            display: none; 
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 10px;
        }

        .player-name-display {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }
        
        .small-title {
            font-size: 14px;
            font-weight: 900;
            opacity: 0.8;
        }

        .board-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 30, 60, 0.6);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .board-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .col-header {
            text-align: center;
            font-weight: 900;
            font-size: 24px;
            color: #FFD700;
            text-shadow: 1px 1px 2px #000;
        }

        .board-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell.marked {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
            border: 2px solid #fff;
            transform: scale(0.95);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .cell.free-space {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            font-size: 12px;
            flex-direction: column;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        
        .cell.free-space.marked {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
        }

        .star { font-size: 20px; margin-bottom: -5px; }

        .btn-bingo {
            background: #555555;
            color: #aaaaaa;
            border: 2px solid #777777;
            padding: 15px;
            font-size: 28px;
            font-weight: 900;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .btn-bingo.active-bingo {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            border: 2px solid #ff5252;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            animation: pulse-bingo 1s infinite;
        }

        .btn-bingo.active-bingo:active {
            transform: scale(0.98);
        }

        @keyframes pulse-bingo {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5); }
            50% { transform: scale(1.02); box-shadow: 0 5px 25px rgba(211, 47, 47, 0.9); }
            100% { transform: scale(1); box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5); }
        }

        #winner-screen {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: flashWinner 0.5s infinite alternate;
        }

        @keyframes flashWinner {
            0% { background-color: #FFD700; color: #001f3f; }
            100% { background-color: #ffffff; color: #d32f2f; }
        }

        .winner-text {
            font-size: 60px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .winner-name {
            font-size: 40px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-close-winner {
            margin-top: 40px;
            padding: 10px 30px;
            background: #001f3f;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-family: 'Sarabun';
        }

    </style>
</head>
<body>

    <div id="login-screen">
        <img src="cls_logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'">
        <div class="login-title">ER&EMS RJRH<br>BINGO</div>
        <input type="text" id="playerNameInput" class="name-input" placeholder="พิมพ์ชื่อของคุณที่นี่..." autocomplete="off">
        <button class="btn-start" onclick="startGame()">เข้าสู่เกมเพลย์</button>
    </div>

    <div id="game-screen">
        <div class="top-bar">
            <div class="player-name-display">👤 <span id="displayName">ผู้เล่น</span></div>
            <div class="small-title">ER&EMS RJRH</div>
        </div>

        <div class="board-wrapper">
            <div class="board-header-row">
                <div class="col-header">B</div>
                <div class="col-header">I</div>
                <div class="col-header">N</div>
                <div class="col-header">G</div>
                <div class="col-header">O</div>
            </div>
            <div class="board-grid" id="boardGrid">
            </div>
        </div>

        <div class="btn-bingo" id="btnBingo" onclick="attemptBingo()">แจ้ง BINGO!</div>
    </div>

    <div id="winner-screen">
        <h1 class="winner-text">BINGO!</h1>
        <div class="winner-name" id="winnerNameDisplay">ชื่อผู้เล่น</div>
        <p style="font-size: 20px; font-weight:bold; margin-top:10px;">โปรดชูหน้าจอให้เจ้าหน้าที่ตรวจสอบ</p>
        
        <button class="btn-close-winner" onclick="closeBingoScreen()">ย้อนกลับ / กดผิด</button>
    </div>

    <script>
        // ฟังก์ชันบังคับเข้าโหมดเต็มหน้าจอ (Full Screen)
        function enterFullScreen() {
            let docEl = document.documentElement;
            let requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            
            if(requestFullScreen) {
                requestFullScreen.call(docEl).catch(err => {
                    console.log("เข้าสู่โหมดเต็มจอไม่ได้ (ระบบ iOS อาจไม่รองรับบางรุ่น):", err);
                });
            }
        }

        function getUniqueNumbers(count, min, max) {
            const nums = new Set();
            while(nums.size < count) {
                nums.add(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            return Array.from(nums);
        }

        function startGame() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            if (nameInput === "") {
                alert("กรุณาพิมพ์ชื่อก่อนเข้าเกมครับ");
                return;
            }

            // สั่งให้เข้าโหมดเต็มจอเมื่อกดปุ่มเริ่มเกม
            enterFullScreen();

            document.getElementById('displayName').innerText = nameInput;
            document.getElementById('winnerNameDisplay').innerText = nameInput;

            generateBoard();

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        }

        function generateBoard() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = ''; 

            const data = {
                B: getUniqueNumbers(5, 1, 15),
                I: getUniqueNumbers(5, 16, 30),
                N: getUniqueNumbers(4, 31, 45),
                G: getUniqueNumbers(5, 46, 60),
                O: getUniqueNumbers(5, 61, 75)
            };

            for (let row = 0; row < 5; row++) {
                grid.appendChild(createCell(data.B[row]));
                grid.appendChild(createCell(data.I[row]));
                
                if (row === 2) {
                    const freeCell = document.createElement('div');
                    freeCell.className = 'cell free-space marked'; 
                    freeCell.innerHTML = '<span class="star">★</span><span>RJRH</span>';
                    grid.appendChild(freeCell);
                } else {
                    let nIndex = row < 2 ? row : row - 1;
                    grid.appendChild(createCell(data.N[nIndex]));
                }

                grid.appendChild(createCell(data.G[row]));
                grid.appendChild(createCell(data.O[row]));
            }
            
            verifyBingoState();
        }

        function createCell(number) {
            const div = document.createElement('div');
            div.className = 'cell';
            div.innerText = number;
            div.onclick = function() {
                this.classList.toggle('marked');
                verifyBingoState(); 
            };
            return div;
        }

        function checkWinningPatterns() {
            const cells = Array.from(document.querySelectorAll('.cell'));
            const m = cells.map(cell => cell.classList.contains('marked'));
            
            if(m.length !== 25) return false;

            for(let r = 0; r < 5; r++) {
                if(m[r*5] && m[r*5+1] && m[r*5+2] && m[r*5+3] && m[r*5+4]) return true;
            }
            for(let c = 0; c < 5; c++) {
                if(m[c] && m[c+5] && m[c+10] && m[c+15] && m[c+20]) return true;
            }
            if(m[0] && m[6] && m[12] && m[18] && m[24]) return true;
            if(m[4] && m[8] && m[12] && m[16] && m[20]) return true;
            if(m[0] && m[4] && m[20] && m[24]) return true;
            if(m[6] && m[8] && m[16] && m[18]) return true;

            return false;
        }

        function verifyBingoState() {
            const btn = document.getElementById('btnBingo');
            if (checkWinningPatterns()) {
                btn.classList.add('active-bingo'); 
            } else {
                btn.classList.remove('active-bingo'); 
            }
        }

        function attemptBingo() {
            if (checkWinningPatterns()) {
                document.getElementById('winner-screen').style.display = 'flex';
            } else {
                alert("รูปแบบยังไม่ถูกต้องครับ! \nคุณต้องกาให้ครบ 5 ช่องเรียงกัน หรือ กาครบ 4 มุมนอก/4 มุมใน");
            }
        }

        function closeBingoScreen() {
            document.getElementById('winner-screen').style.display = 'none';
        }
    </script>
</body>
</html>
