<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ป้องกันการซูมหน้าจอเวลาจิ้มบนมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER&EMS RJRH BINGO - Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* เอาแถบสีฟ้าเวลากดบนมือถือออก */
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #000c19, #001f3f, #003366, #001f3f);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 1. หน้าจอลงทะเบียน (Login Screen) --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .login-logo {
            width: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .login-title {
            color: #FFD700;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 18px;
            font-family: 'Sarabun', sans-serif;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            color: #001f3f;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            font-family: 'Sarabun', sans-serif;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- 2. หน้าจอเล่นเกม (Game Screen) --- */
        #game-screen {
            display: none; /* ซ่อนไว้ก่อน */
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 10px;
        }

        .player-name-display {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }
        
        .small-title {
            font-size: 14px;
            font-weight: 900;
            opacity: 0.8;
        }

        /* กระดานบิงโกบนมือถือ */
        .board-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 30, 60, 0.6);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .board-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .col-header {
            text-align: center;
            font-weight: 900;
            font-size: 24px;
            color: #FFD700;
            text-shadow: 1px 1px 2px #000;
        }

        .board-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* เมื่อผู้เล่นกดกากบาทช่อง */
        .cell.marked {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
            border: 2px solid #fff;
            transform: scale(0.95);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .cell.free-space {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            font-size: 12px;
            flex-direction: column;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        
        .cell.free-space.marked {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            color: #001f3f;
        }

        .star { font-size: 20px; margin-bottom: -5px; }

        /* ปุ่ม BINGO สีแดงเด่นๆ */
        .btn-bingo {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            border: 2px solid #ff5252;
            padding: 15px;
            font-size: 28px;
            font-weight: 900;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .btn-bingo:active {
            transform: scale(0.98);
        }

        /* --- 3. หน้าจอเรียกพนักงาน (Flashing Screen) --- */
        #winner-screen {
            display: none; /* ซ่อนไว้ก่อน */
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: flashWinner 0.5s infinite alternate;
        }

        @keyframes flashWinner {
            0% { background-color: #FFD700; color: #001f3f; }
            100% { background-color: #ffffff; color: #d32f2f; }
        }

        .winner-text {
            font-size: 60px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .winner-name {
            font-size: 40px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-close-winner {
            margin-top: 40px;
            padding: 10px 30px;
            background: #001f3f;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-family: 'Sarabun';
        }

    </style>
</head>
<body>

    <!-- 1. หน้าจอใส่ชื่อ -->
    <div id="login-screen">
        <img src="cls_logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'">
        <div class="login-title">ER&EMS RJRH<br>BINGO</div>
        <input type="text" id="playerNameInput" class="name-input" placeholder="พิมพ์ชื่อของคุณที่นี่..." autocomplete="off">
        <button class="btn-start" onclick="startGame()">เข้าสู่เกมเพลย์</button>
    </div>

    <!-- 2. หน้าจอกระดานบิงโก -->
    <div id="game-screen">
        <div class="top-bar">
            <div class="player-name-display">👤 <span id="displayName">ผู้เล่น</span></div>
            <div class="small-title">ER&EMS RJRH</div>
        </div>

        <div class="board-wrapper">
            <div class="board-header-row">
                <div class="col-header">B</div>
                <div class="col-header">I</div>
                <div class="col-header">N</div>
                <div class="col-header">G</div>
                <div class="col-header">O</div>
            </div>
            <div class="board-grid" id="boardGrid">
                <!-- ช่องตารางจะถูกสร้างด้วย Javascript -->
            </div>
        </div>

        <div class="btn-bingo" onclick="callBingo()">แจ้ง BINGO!</div>
    </div>

    <!-- 3. หน้าจอเอฟเฟกต์ตอนกด BINGO (ให้เจ้าหน้าที่ตรวจ) -->
    <div id="winner-screen">
        <h1 class="winner-text">BINGO!</h1>
        <div class="winner-name" id="winnerNameDisplay">ชื่อผู้เล่น</div>
        <p style="font-size: 20px; font-weight:bold; margin-top:10px;">โปรดชูหน้าจอให้เจ้าหน้าที่ตรวจสอบ</p>
        
        <!-- เผื่อผู้เล่นกดผิด ให้กดยกเลิกกลับไปหน้ากระดานได้ -->
        <button class="btn-close-winner" onclick="closeBingoScreen()">ย้อนกลับ / กดผิด</button>
    </div>

    <script>
        // สุ่มตัวเลขไม่ซ้ำ
        function getUniqueNumbers(count, min, max) {
            const nums = new Set();
            while(nums.size < count) {
                nums.add(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            return Array.from(nums);
        }

        // เริ่มเกม
        function startGame() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            if (nameInput === "") {
                alert("กรุณาพิมพ์ชื่อก่อนเข้าเกมครับ");
                return;
            }

            document.getElementById('displayName').innerText = nameInput;
            document.getElementById('winnerNameDisplay').innerText = nameInput;

            generateBoard();

            // สลับหน้าจอ
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        }

        // สร้างกระดานบิงโก
        function generateBoard() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = ''; // ล้างกระดานเดิม

            const data = {
                B: getUniqueNumbers(5, 1, 15),
                I: getUniqueNumbers(5, 16, 30),
                N: getUniqueNumbers(4, 31, 45), // N มี 4 ตัว
                G: getUniqueNumbers(5, 46, 60),
                O: getUniqueNumbers(5, 61, 75)
            };

            for (let row = 0; row < 5; row++) {
                // คอลัมน์ B
                grid.appendChild(createCell(data.B[row]));
                // คอลัมน์ I
                grid.appendChild(createCell(data.I[row]));
                
                // คอลัมน์ N (แถวที่ 3 เป็น Free Space)
                if (row === 2) {
                    const freeCell = document.createElement('div');
                    freeCell.className = 'cell free-space marked'; // ให้ Free mark ไว้แต่แรก
                    freeCell.innerHTML = '<span class="star">★</span><span>FREE</span>';
                    freeCell.onclick = function() { this.classList.toggle('marked'); };
                    grid.appendChild(freeCell);
                } else {
                    // ถ้า row < 2 ใช้ index ปกติ, ถ้า > 2 ต้องลด index ลง 1 เพราะโดนคั่นด้วย Free space
                    let nIndex = row < 2 ? row : row - 1;
                    grid.appendChild(createCell(data.N[nIndex]));
                }

                // คอลัมน์ G
                grid.appendChild(createCell(data.G[row]));
                // คอลัมน์ O
                grid.appendChild(createCell(data.O[row]));
            }
        }

        // สร้างช่องตัวเลข 1 ช่อง
        function createCell(number) {
            const div = document.createElement('div');
            div.className = 'cell';
            div.innerText = number;
            // เมื่อกดที่ช่อง ให้สลับสถานะ Marked (สีทอง)
            div.onclick = function() {
                this.classList.toggle('marked');
            };
            return div;
        }

        // เมื่อกดปุ่มแจ้ง BINGO
        function callBingo() {
            if(confirm("ยืนยันว่าคุณ BINGO แล้วใช่หรือไม่?")) {
                document.getElementById('winner-screen').style.display = 'flex';
            }
        }

        // ปิดหน้าจอ BINGO (เผื่อผู้เล่นกดเล่น)
        function closeBingoScreen() {
            document.getElementById('winner-screen').style.display = 'none';
        }
    </script>
</body>
</html>
